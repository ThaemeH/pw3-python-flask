{% extends 'base.html' %}
{% block content %}

<div class="container" style="background-color: #f0f0f0; border-radius: 8px; padding: 20px;">
    <div class="row">
        {% for musica in listaMusicas %}
        <div class="col-md-3 m-auto mb-4">
            <div class="card" style="width: 16rem;">
                <img src="{{musica.imagem}}" class="card-img-top" alt="Capa do álbum">
                <div class="card-body">
                    <h5>{{musica.titulo}}</h5>
                    <p>Artista: {{musica.artista}}</p>

                    <a href="{{url_for('item', id=musica.id)}}" class="btn btn-dark">+ Info</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock content %}
